function updEnemy(e,dt){const c=ET[e.kind];e.t+=dt;e.cd=Math.max(0,e.cd-dt);e.flash=Math.max(0,(e.flash||0)-dt);
 if(e.dead){e.dt+=dt;return;}
 const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);e.face=dx>0?1:-1;
 if(e.st=='idle'){if(d<340&&!P.dead)e.st='chase';}
 else if(e.st=='chase'){if(d>60&&(c.ranged?d>260:1)){e.x+=Math.sign(dx)*c.spd*dt;e.y+=Math.sign(dy)*c.spd*.5*dt;}
  if(c.ranged&&d<300&&d>80&&e.cd<=0){e.cd=2.2;e.st='atk';e.t=0;}
  else if(!c.ranged&&d<62&&e.cd<=0){e.cd=1.3;e.st='atk';e.t=0;}
  if(c.pounce&&d<220&&d>90&&e.cd<=0){e.cd=2.5;e.st='atk';e.t=0;}
  if(d>420)e.st='idle';}
 else if(e.st=='atk'){const dur=c.ranged?.9:c.pounce?.7:.6;
  if(c.pounce&&e.t>dur*.5){e.x+=Math.sign(dx)*220*dt;e.y+=Math.sign(dy)*110*dt;}
  if(e.t>dur*.55&&e.t<dur*.6+dt){if(Math.hypot(P.x-e.x,P.y-e.y)<(c.ranged?400:70)){
   if(c.ranged)PROJ.push({x:e.x+e.face*20,y:e.y-60,vx:e.face*300,vy:0,dmg:c.dmg,from:'e',kind:'arrowE',t:0});
   else hurtPlayer(c.dmg,e.x);}}
  if(e.t>dur)e.st='chase';}
 e.y=Math.max(GT-40,Math.min(GB,e.y));}

function startContinue(){const d=loadSave();if(!d)return startNew();
 flags.warlord=d.flags.warlord||0;flags.lich=d.flags.lich||0;flags.dragon=d.flags.dragon||0;
 Object.assign(P,{char:d.char,x:d.x,y:d.y,hp:d.hp,maxhp:d.maxhp,coins:d.coins,sword:d.sword,pot:d.pot,bomb:d.bomb,keys:d.keys,amul:d.amul||0,dead:0,shopNpc:null});
 buildWorld();
 for(const o of OBJ)if(o.type=='chest'&&(d.chests||[]).includes(o.id)){o.open=1;o.fr='chesto';}
 for(const o of OBJ)if(o.type=='door'){if(o.lock=='gold'&&P.keys.gold){o.solid=0;o.fr='garch';o.sh='tiles_castle';}
  if(o.lock=='silver'&&P.keys.silver){o.solid=0;o.fr='carch';o.sh='tiles_catacomb';}
  if(o.lock=='seal'&&flags.warlord)o.solid=0;
  if(o.lock=='seal2'&&flags.lich){o.solid=0;o.fr='garch';o.sh='tiles_castle';}}
 state='play';say('Save loaded. Welcome back, '+(P.char=='lane'?'Lane':'Knight')+'!',3);}
let last=0;
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;time+=dt;msgT=Math.max(0,msgT-dt);readInput();
 if(state=='title'){if(IN.leftP)selChar=0;if(IN.rightP)selChar=1;
  if(IN.startP){const sv=loadSave();sv?startContinue():startNew();}
  else if(IN.confP||IN.atkP)startNew();
  else if(pressed('c')){const sv=loadSave();sv?startContinue():startNew();}}
 else if(state=='play'){
  if(IN.pauseP){state='pause';saveGame();beep(300,.12,'sine');}
  else{updPlayer(dt);ENTS.forEach(e=>e.boss?updBoss(e,dt):updEnemy(e,dt));
   ENTS=ENTS.filter(e=>!e.dead||e.dt<1.2||e.boss);updProj(dt);
   for(let i=FX.length-1;i>=0;i--){FX[i].t+=dt;if(FX[i].t>FX[i].life)FX.splice(i,1);}
   cam=Math.max(0,Math.min(WW-W,P.x-W/2));
   const zn=zoneAt(P.x).name;if(zn!=lastZone){lastZone=zn;saveGame();}
   saveT+=dt;if(saveT>6){saveT=0;saveGame();}}}
 else if(state=='pause'){if(IN.pauseP||IN.confP){state='play';beep(500,.1,'sine');}}
 else if(state=='dead'){P.t+=dt;if(IN.confP){P.dead=0;P.hp=P.maxhp;P.coins=Math.max(0,P.coins-20);P.x=Math.max(60,P.x-300);P.y=440;state='play';say('You rise... (-20 coins)',3);saveGame();}}
 else if(state=='banner'){if(IN.confP){state=banner=='dragon'?'win':'play';if(state=='play')saveGame();}}
 else if(state=='win'){if(IN.confP)state='title';}
 T.jp={};draw(dt);requestAnimationFrame(loop);}
/* title touch buttons */
cv.addEventListener('touchstart',e=>{if(state!='title')return;const p=toC(e.changedTouches[0]);
 if(p.x>150&&p.x<410&&p.y>250&&p.y<430){selChar=0;return;}
 if(p.x>550&&p.x<810&&p.y>250&&p.y<430){selChar=1;return;}
 if(p.y>448&&p.y<492){if(p.x<W/2-10){const sv=loadSave();sv?startContinue():startNew();}else startNew();}},{passive:true});
/* ================= PWA: service worker ================= */
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>console.log('[PWA] sw ready')).catch(()=>{}));
buildWorld();requestAnimationFrame(loop);
</script></body></html>
